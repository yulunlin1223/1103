<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>W8 Task2 - AR.js 多物件擴增實境學習教材</title>
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- A-Frame 和 AR.js -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
  </style>
</head>
<body class="bg-gray-900 text-white">

  <!-- 頂部導覽列：可切換 AR 模式或 3D 預覽模式 -->
  <header class="absolute top-0 left-0 w-full z-50 bg-black/80 backdrop-blur-md p-4 flex justify-between items-center shadow-lg">
    <h1 class="text-xs font-bold text-emerald-400">🌿 W8 Task2: AR 多物件生態教材</h1>
    <div class="space-x-1">
      <button onclick="switchView('ar')" id="btn-ar" class="px-2.5 py-1 bg-emerald-600 text-xs rounded-lg shadow font-medium">AR 鏡頭模式</button>
      <button onclick="switchView('web3d')" id="btn-web3d" class="px-2.5 py-1 bg-gray-700 text-xs rounded-lg shadow font-medium">3D 預覽模式</button>
    </div>
  </header>
