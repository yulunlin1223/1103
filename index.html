<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR.js 擴增實境互動學習教材</title>
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- A-Frame 和 AR.js -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
  </style>
</head>
<body class="bg-gray-900 text-white">

  <!-- 頂部導覽列 -->
  <header class="absolute top-0 left-0 w-full z-50 bg-black/60 backdrop-blur-md p-4 flex justify-between items-center shadow-lg">
    <h1 class="text-lg font-bold text-emerald-400">🌿 里山校園生態 AR 學習教材</h1>
    <div class="space-x-2">
      <button onclick="switchMode('learn')" id="btn-learn" class="px-3 py-1 bg-emerald-600 text-sm rounded-lg shadow font-medium transition">學習模式</button>
      <button onclick="switchMode('quiz')" id="btn-quiz" class="px-3 py-1 bg-gray-700 text-sm rounded-lg shadow font-medium transition">互動測驗</button>
    </div>
  </header>

  <!-- AR 畫面容器 -->
  <div id="ar-container" class="absolute inset-0">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" vr-mode-ui="enabled: false">
      
      <!-- 支援 Hiro 標記辨識 -->
      <a-marker preset="hiro">
        <!-- 3D 互動模型群組 (以太陽系/植物生態模型為例) -->
        <a-entity id="model-group" position="0 0.5 0" scale="0.8 0.8 0.8">
          <!-- 模擬生態核心 3D 物件 (組合形體) -->
          <a-sphere position="0 0 0" radius="0.5" color="#34d399" material="opacity: 0.8; transparent: true;" animation="property: rotation; to: 0 360 0; dur: 10000; loop: true; easing: linear;"></a-sphere>
          <a-torus position="0 0 0" radius="0.8" tube="0.02" rotation="75 0 0" color="#60a5fa" animation="property: rotation; to: 75 360 0; dur: 6000; loop: true; easing: linear;"></a-torus>
          <a-box position="0 0.8 0" depth="0.2" height="0.2" width="0.2" color="#f472b6" animation="property: position; to: 0 1 0; dir: alternate; dur: 1500; loop: true;"></a-box>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </div>

  <!-- 學習模式控制面板與資訊卡 -->
  <div id="panel-learn" class="absolute bottom-6 left-4 right-4 z-50 bg-black/70 backdrop-blur-md p-4 rounded-2xl border border-gray-700 shadow-xl max-w-md mx-auto">
    <h2 class="text-base font-bold text-emerald-300 mb-1">🎯 目前辨識目標：校園生態核心模型</h2>
    <p class="text-xs text-gray-300 mb-3">請將手機相機對準電腦螢幕或列印出來的 <span class="text-yellow-400 font-bold">Hiro 標記圖</span>，即可在畫面上檢視 3D 結構。</p>
    <div class="flex justify-between items-center bg-gray-800/80 p-2.5 rounded-xl">
      <span class="text-xs text-gray-400">語音導覽解說：</span>
      <button onclick="playSpeech()" class="px-3 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-xs font-bold rounded-lg shadow transition">🔊 播放解說</button>
    </div>
  </div>

  <!-- 互動測驗面板 (預設隱藏) -->
  <div id="panel-quiz" class="absolute bottom-6 left-4 right-4 z-50 bg-black/80 backdrop-blur-md p-5 rounded-2xl border border-gray-700 shadow-xl max-w-md mx-auto hidden">
    <h2 class="text-base font-bold text-yellow-400 mb-2">📝 隨堂小測驗</h2>
    <p id="quiz-question" class="text-sm text-gray-200 mb-3">Q1：在 AR 畫面上呈現並轉動的核心模型，主要象徵校園中的哪種環境教育意涵？</p>
    <div class="space-y-2 text-xs">
      <button onclick="checkAnswer(false)" class="w-full text-left p-2.5 rounded-lg bg-gray-800 hover:bg-gray-700 transition border border-gray-700">A. 單純的幾何裝飾圖形</button>
      <button onclick="checkAnswer(true)" class="w-full text-left p-2.5 rounded-lg bg-gray-800 hover:bg-gray-700 transition border border-gray-700">B. 里山生態體系與動植物多樣性循環</button>
      <button onclick="checkAnswer(false)" class="w-full text-left p-2.5 rounded-lg bg-gray-800 hover:bg-gray-700 transition border border-gray-700">C. 建築物結構藍圖</button>
    </div>
    <div id="quiz-result" class="mt-3 text-xs font-bold text-center"></div>
  </div>

  <script>
    // 切換學習與測驗模式
    function switchMode(mode) {
      const learnBtn = document.getElementById('btn-learn');
      const quizBtn = document.getElementById('btn-quiz');
      const learnPanel = document.getElementById('panel-learn');
      const quizPanel = document.getElementById('panel-quiz');

      if (mode === 'learn') {
        learnBtn.className = "px-3 py-1 bg-emerald-600 text-sm rounded-lg shadow font-medium transition";
        quizBtn.className = "px-3 py-1 bg-gray-700 text-sm rounded-lg shadow font-medium transition";
        learnPanel.classList.remove('hidden');
        quizPanel.classList.add('hidden');
      } else {
        quizBtn.className = "px-3 py-1 bg-emerald-600 text-sm rounded-lg shadow font-medium transition";
        learnBtn.className = "px-3 py-1 bg-gray-700 text-sm rounded-lg shadow font-medium transition";
        quizPanel.classList.remove('hidden');
        learnPanel.classList.add('hidden');
      }
    }

    // 語音導覽功能
    function playSpeech() {
      if ('speechSynthesis' in window) {
        const text = "這是淡江校園里山生態探索的擴增實境教材。畫面上呈現的是結合動植物多樣性與環境教育的3D立體模型，請試著移動相機從不同角度觀察。";
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-TW';
        window.speechSynthesis.speak(utterance);
      } else {
        alert("您的瀏覽器不支援語音合成功能。");
      }
    }

    // 測驗檢查
    function checkAnswer(isCorrect) {
      const resultDiv = document.getElementById('quiz-result');
      if (isCorrect) {
        resultDiv.className = "mt-3 text-xs font-bold text-center text-emerald-400";
        resultDiv.innerText = "🎉 答對了！你已掌握里山環境教育的核心精神。";
      } else {
        resultDiv.className = "mt-3 text-xs font-bold text-center text-rose-400";
        resultDiv.innerText = "❌ 答錯囉！再仔細思考一下生態平衡與循環的概念。";
      }
    }
  </script>

</body>
</html>
